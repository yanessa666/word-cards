<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Cards - 单词记忆卡片</title>
<style>
  :root {
    --primary: #1a365d;
    --primary-light: #2c5282;
    --accent: #d69e2e;
    --accent-light: #ecc94b;
    --bg: #f7fafc;
    --card-bg: #ffffff;
    --text: #1a202c;
    --text-secondary: #4a5568;
    --text-light: #718096;
    --border: #e2e8f0;
    --tag-verb: #3182ce;
    --tag-adj: #dd6b20;
    --tag-noun: #38a169;
    --tag-adv: #805ad5;
    --tag-prep: #d53f8c;
    --tag-default: #718096;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --shadow-hover: 0 8px 30px rgba(0,0,0,0.14);
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--primary); color: white;
    padding: 14px 28px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    z-index: 2000; transition: transform 0.3s ease;
    box-shadow: 0 8px 20px rgba(26,54,93,0.3); white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.toast-error { background: #c53030; }
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white; padding: 32px 24px 28px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(26,54,93,0.2);
  }
  .header-inner {
    max-width: 900px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
  }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: var(--accent-light); }
  .header-stats { display: flex; gap: 20px; font-size: 14px; opacity: 0.9; }
  .header-stats strong { font-size: 20px; display: block; }
  .toolbar {
    max-width: 900px; margin: 0 auto;
    padding: 20px 24px; display: flex; gap: 12px;
    flex-wrap: wrap; align-items: center;
  }
  .search-box { flex: 1; min-width: 200px; position: relative; }
  .search-box input {
    width: 100%; padding: 12px 16px 12px 44px;
    border: 2px solid var(--border); border-radius: 12px;
    font-size: 15px; outline: none; transition: border-color 0.2s;
    background: var(--card-bg); font-family: inherit;
  }
  .search-box input:focus { border-color: var(--primary-light); }
  .search-box::before {
    content: '\1F50D'; position: absolute;
    left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 16px; pointer-events: none;
  }
  .btn {
    padding: 12px 22px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; display: inline-flex; align-items: center;
    gap: 6px; white-space: nowrap; font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
  }
  .btn-primary:hover { box-shadow: 0 4px 12px rgba(26,54,93,0.3); }
  .btn-accent {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
    color: var(--primary);
  }
  .btn-accent:hover { box-shadow: 0 4px 12px rgba(214,158,46,0.3); }
  .btn-outline { background: var(--card-bg); color: var(--primary); border: 2px solid var(--border); }
  .btn-outline:hover { border-color: var(--primary-light); }
  .btn-ghost {
    background: transparent; color: var(--primary-light);
    border: 1px solid transparent; padding: 6px 10px;
    font-size: 13px; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-weight: 600;
  }
  .btn-ghost:hover { background: #ebf8ff; }
  .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 10px; }
  .cards-container {
    max-width: 900px; margin: 0 auto;
    padding: 0 24px 60px; display: flex;
    flex-direction: column; gap: 24px;
  }
  .word-card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
    transition: box-shadow 0.3s, transform 0.2s; border: 1px solid var(--border);
  }
  .word-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .card-header {
    padding: 24px 28px 16px; display: flex;
    align-items: flex-start; justify-content: space-between; gap: 16px;
  }
  .word-main { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .word-text {
    font-size: 36px; font-weight: 800; color: var(--primary);
    letter-spacing: -1px; line-height: 1.1; cursor: pointer; user-select: all;
  }
  .word-text:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  .word-phonetic { font-size: 16px; color: var(--text-light); font-style: italic; font-family: Georgia, serif; }
  .speak-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--primary-light); background: white;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 0; transition: all 0.2s;
    flex-shrink: 0;
  }
  .speak-btn:hover { background: var(--primary); border-color: var(--primary); }
  .speak-btn:hover .speak-icon { stroke: white; }
  .speak-btn.speaking {
    background: var(--accent); border-color: var(--accent);
    animation: pulse 0.8s ease infinite;
  }
  .speak-btn.speaking .speak-icon { stroke: white; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .card-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border); background: white;
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: #fee; border-color: #fc8181; }
  .icon-btn.edit-btn:hover { background: #ebf8ff; border-color: #90cdf4; }
  .forms-bar { padding: 0 28px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .forms-label { font-size: 12px; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-tag { padding: 4px 12px; background: #edf2f7; border-radius: 8px; font-size: 13px; color: var(--text-secondary); font-weight: 500; }
  .similar-bar { padding: 0 28px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .similar-label { font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .similar-tag {
    padding: 4px 12px; background: #fffff0;
    border: 1px solid var(--accent-light); border-radius: 8px;
    font-size: 13px; color: var(--tag-adj); font-weight: 500;
    cursor: pointer; transition: background 0.2s;
  }
  .similar-tag:hover { background: var(--accent-light); color: var(--primary); }
  .collocations-bar { padding: 0 28px 16px; }
  .collocations-bar-inner { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .collocations-label { font-size: 12px; color: var(--tag-noun); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; }
  .collocation-item {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; background: #f0fff4; border: 1px solid #c6f6d5;
    border-radius: 10px; font-size: 13px; transition: all 0.2s; cursor: default;
  }
  .collocation-item:hover { background: #dcfce7; border-color: #86efac; }
  .collocation-phrase { font-weight: 700; color: var(--tag-noun); }
  .collocation-sep { color: var(--text-light); }
  .collocation-meaning { color: var(--text-secondary); }
  .collocation-translate-btn {
    padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: white; cursor: pointer; font-size: 11px; color: var(--text-light);
    transition: all 0.2s; font-family: inherit; flex-shrink: 0;
  }
  .collocation-translate-btn:hover { background: #ebf8ff; border-color: var(--primary-light); color: var(--primary); }
  .collo-translation {
    display: none; margin-top: 4px; padding: 6px 10px; background: #fffff0;
    border-radius: 6px; font-size: 12px; color: var(--tag-adj); line-height: 1.5;
  }
  .collo-translation.visible { display: block; }
  .definitions { padding: 0 28px; }
  .def-item { padding: 14px 0; border-top: 1px dashed var(--border); }
  .def-item:first-child { border-top: none; }
  .def-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .pos-tag { padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; margin-top: 2px; }
  .pos-v { background: #ebf8ff; color: var(--tag-verb); }
  .pos-adj { background: #fffaf0; color: var(--tag-adj); }
  .pos-n { background: #f0fff4; color: var(--tag-noun); }
  .pos-adv { background: #faf5ff; color: var(--tag-adv); }
  .pos-prep { background: #fff5f7; color: var(--tag-prep); }
  .pos-default { background: #edf2f7; color: var(--tag-default); }
  .def-en { font-size: 15px; color: var(--text); line-height: 1.5; font-weight: 500; }
  .example-block {
    margin-top: 8px; padding: 10px 14px; background: #f7fafc;
    border-radius: 10px; border-left: 3px solid var(--accent);
    position: relative;
  }
  .example-en { font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-style: italic; }
  .example-en em { font-style: normal; color: var(--primary); font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent-light); text-underline-offset: 3px; }
  .example-cn { font-size: 13px; color: var(--text-light); margin-top: 4px; line-height: 1.5; }
  .translate-btn {
    position: absolute; top: 8px; right: 10px;
    padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: white;
    cursor: pointer; font-size: 11px; color: var(--text-light);
    transition: all 0.2s; font-family: inherit;
  }
  .translate-btn:hover { background: #ebf8ff; border-color: var(--primary-light); color: var(--primary); }
  .translate-btn.loading { opacity: 0.6; cursor: wait; }
  .translation-result {
    margin-top: 6px; padding: 8px 12px; background: #fffff0;
    border-radius: 8px; font-size: 13px; color: var(--tag-adj);
    line-height: 1.5; display: none;
  }
  .translation-result.visible { display: block; }

  /* Memory Aids */
  .memory-aids-section { margin: 0 28px 16px; }
  .memory-aid { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
  .memory-aid:last-child { margin-bottom: 0; }
  .memory-toggle {
    width: 100%; padding: 12px 16px;
    background: linear-gradient(135deg, #fffbeb 0%, #fefcbf 100%);
    border: none; cursor: pointer; display: flex;
    align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; color: var(--accent);
    transition: background 0.2s; font-family: inherit;
  }
  .memory-toggle:hover { filter: brightness(0.97); }
  .memory-toggle .arrow { transition: transform 0.3s; font-size: 12px; display: inline-block; }
  .memory-toggle.open .arrow { transform: rotate(180deg); }
  .memory-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .memory-content.open { max-height: 800px; }
  .memory-inner { padding: 16px; font-size: 14px; line-height: 1.8; color: var(--text-secondary); position: relative; }
  .memory-inner .memory-en { color: var(--text-secondary); }
  .memory-inner .memory-cn { color: var(--text-light); font-size: 13px; margin-top: 8px; }
  .memory-translate-btn {
    margin-top: 10px; padding: 4px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: white;
    cursor: pointer; font-size: 12px; color: var(--text-light);
    transition: all 0.2s; font-family: inherit; font-weight: 600;
  }
  .memory-translate-btn:hover { background: #ebf8ff; border-color: var(--primary-light); color: var(--primary); }

  .card-translate-bar { padding: 0 28px 12px; display: flex; gap: 8px; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 1000;
    align-items: center; justify-content: center; padding: 24px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card-bg); border-radius: var(--radius); width: 100%;
    max-width: 640px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: modalIn 0.25s ease;
  }
  @keyframes modalIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal-header {
    padding: 24px 28px 16px; display: flex;
    justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--card-bg); z-index: 1;
  }
  .modal-header h2 { font-size: 20px; font-weight: 700; color: var(--primary); }
  .modal-close {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: #edf2f7; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .modal-close:hover { background: #e2e8f0; }
  .modal-body { padding: 24px 28px; }
  .modal-footer {
    padding: 16px 28px 24px; display: flex; gap: 12px;
    justify-content: flex-end; position: sticky; bottom: 0;
    background: var(--card-bg); border-top: 1px solid var(--border);
  }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .form-group small { color: var(--text-light); font-size: 12px; }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%; padding: 10px 14px; border: 2px solid var(--border);
    border-radius: 10px; font-size: 14px; outline: none;
    transition: border-color 0.2s; font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary-light); }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .defs-editor { border: 2px solid var(--border); border-radius: 12px; padding: 16px; }
  .def-entry { padding: 12px; background: #f7fafc; border-radius: 10px; margin-bottom: 12px; position: relative; }
  .def-entry:last-child { margin-bottom: 0; }
  .def-entry-grid { display: grid; grid-template-columns: 100px 1fr; gap: 8px; }
  .def-entry-full { grid-column: 1 / -1; }
  .remove-def {
    position: absolute; top: 8px; right: 8px;
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: #fed7d7; color: #e53e3e; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .remove-def:hover { background: #feb2b2; }
  .add-def-btn {
    margin-top: 12px; padding: 8px 16px; border: 2px dashed var(--border);
    border-radius: 10px; background: white; cursor: pointer; font-size: 13px;
    color: var(--text-light); width: 100%; transition: all 0.2s;
    font-family: inherit; font-weight: 600;
  }
  .add-def-btn:hover { border-color: var(--primary-light); color: var(--primary); }
  .empty-state { text-align: center; padding: 60px 24px; color: var(--text-light); }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 16px; margin-bottom: 20px; }

  /* Collocations Editor */
  .collocations-editor { border: 2px solid var(--border); border-radius: 12px; padding: 16px; }
  .collo-entry {
    padding: 12px; background: #f0fff4; border-radius: 10px;
    margin-bottom: 10px; position: relative;
  }
  .collo-entry:last-child { margin-bottom: 0; }
  .collo-entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .collo-entry-full { grid-column: 1 / -1; }
  .remove-collo {
    position: absolute; top: 8px; right: 8px;
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: #fed7d7; color: #e53e3e; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .remove-collo:hover { background: #feb2b2; }
  .add-collo-btn {
    margin-top: 12px; padding: 8px 16px; border: 2px dashed var(--border);
    border-radius: 10px; background: white; cursor: pointer; font-size: 13px;
    color: var(--text-light); width: 100%; transition: all 0.2s;
    font-family: inherit; font-weight: 600;
  }
  .add-collo-btn:hover { border-color: var(--tag-noun); color: var(--tag-noun); }

  /* Memory Aids Editor */
  .memory-aids-editor { border: 2px solid var(--border); border-radius: 12px; padding: 16px; }
  .ma-entry {
    padding: 12px; background: #fffbeb; border-radius: 10px;
    margin-bottom: 10px; position: relative;
  }
  .ma-entry:last-child { margin-bottom: 0; }
  .remove-ma {
    position: absolute; top: 8px; right: 8px;
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: #fed7d7; color: #e53e3e; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .remove-ma:hover { background: #feb2b2; }
  .add-ma-btn {
    margin-top: 12px; padding: 8px 16px; border: 2px dashed var(--border);
    border-radius: 10px; background: white; cursor: pointer; font-size: 13px;
    color: var(--text-light); width: 100%; transition: all 0.2s;
    font-family: inherit; font-weight: 600;
  }
  .add-ma-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Article Generator */
  .word-select-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px; margin-top: 8px;
  }
  .word-select-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 14px; background: #f7fafc; border: 2px solid var(--border);
    border-radius: 10px; cursor: pointer; transition: all 0.2s; user-select: none;
  }
  .word-select-item:hover { border-color: var(--primary-light); background: #ebf8ff; }
  .word-select-item.selected { border-color: var(--tag-noun); background: #f0fff4; }
  .word-select-item input[type="checkbox"] { accent-color: var(--tag-noun); width: 18px; height: 18px; margin-top: 2px; cursor: pointer; flex-shrink: 0; }
  .word-select-info { flex: 1; min-width: 0; }
  .ws-word { font-weight: 700; color: var(--primary); font-size: 15px; }
  .ws-meaning { font-size: 12px; color: var(--text-light); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .article-output { margin-top: 24px; display: none; }
  .article-output.visible { display: block; }
  .article-title-text { font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 16px; }
  .article-content-box {
    padding: 24px; background: #fffff5; border: 2px solid #fefcbf;
    border-radius: 14px; font-size: 16px; line-height: 2;
    color: var(--text); outline: none; min-height: 120px;
  }
  .article-content-box:focus { border-color: var(--accent); }
  .article-highlight {
    background: linear-gradient(to top, #fefcbf 40%, transparent 40%);
    font-weight: 700; color: var(--primary); padding: 0 2px;
    cursor: pointer; border-radius: 2px;
  }
  .article-highlight:hover { background: linear-gradient(to top, #f6e05e 40%, transparent 40%); }
  .article-vocab {
    margin-top: 20px; padding: 20px; background: #f7fafc;
    border-radius: 14px; border: 1px solid var(--border);
  }
  .article-vocab h4 { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
  .vocab-item {
    display: flex; align-items: baseline; gap: 8px;
    padding: 8px 0; border-bottom: 1px dashed var(--border); flex-wrap: wrap;
  }
  .vocab-item:last-child { border-bottom: none; }
  .vocab-word { font-weight: 700; color: var(--tag-noun); min-width: 80px; }
  .vocab-pos { font-size: 12px; color: var(--text-light); font-style: italic; }
  .vocab-meaning { font-size: 14px; color: var(--text-secondary); flex: 1; }
  .article-actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .article-search-box {
    width: 100%; padding: 10px 14px; border: 2px solid var(--border);
    border-radius: 10px; font-size: 14px; outline: none;
    transition: border-color 0.2s; font-family: inherit; margin-bottom: 8px;
  }
  .article-search-box:focus { border-color: var(--primary-light); }

  /* Article Translation */
  .article-translation {
    margin-top: 16px; padding: 20px; background: #f0fff4;
    border: 2px solid #c6f6d5; border-radius: 14px;
    font-size: 15px; line-height: 2; color: var(--text); display: none;
  }
  .article-translation.visible { display: block; }
  .article-translation h4 { font-size: 14px; font-weight: 700; color: var(--tag-noun); margin-bottom: 8px; }

  /* Sentence Analysis */
  .analyze-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: white; cursor: pointer; font-size: 11px; color: var(--text-light);
    transition: all 0.2s; font-family: inherit; font-weight: 600; margin-left: 6px;
    vertical-align: middle;
  }

<script>
var STORAGE_KEY = 'wordCardsData';

/* ========== Voice (Youdao Dict TTS Primary + Web Speech Fallback) ========== */
var ttsAudio = null;
var webSpeechAvailable = ('speechSynthesis' in window);
var voiceList = [];
var currentUtterance = null;
var speechStarted = false;

if (webSpeechAvailable) {
  voiceList = window.speechSynthesis.getVoices();
  if (voiceList.length === 0) {
    window.speechSynthesis.onvoiceschanged = function() {
      voiceList = window.speechSynthesis.getVoices();
    };
  }
}

function getEnVoice() {
  if (!webSpeechAvailable || voiceList.length === 0) {
    voiceList = window.speechSynthesis.getVoices();
  }
  var v = voiceList.find(function(v) { return v.lang === 'en-US'; });
  if (!v) v = voiceList.find(function(v) { return v.lang.startsWith('en'); });
  return v || null;
}

/* Play audio via Youdao Dict TTS — works in China */
function playGoogleTTS(text, btn, onDone) {
  stopTTS();
  /* For single words: use Youdao Dict audio (high quality, CN accessible) */
  var isSingleWord = /^\s*\S+\s*$/.test(text);
  var url;
  if (isSingleWord) {
    var w = text.trim().toLowerCase();
    url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(w) + '&type=2';
  } else {
    /* For phrases/sentences: use Web Speech API directly */
    if (webSpeechAvailable) {
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US'; utter.rate = 0.88;
      var ev = getEnVoice(); if (ev) utter.voice = ev;
      utter.onend = function() { if (btn) btn.classList.remove('speaking'); hideSpeakingBar(); if (onDone) onDone(); };
      utter.onerror = function() { if (btn) btn.classList.remove('speaking'); hideSpeakingBar(); if (onDone) onDone(); };
      if (btn) btn.classList.add('speaking');
      showSpeakingBar(text);
      window.speechSynthesis.speak(utter);
      return;
    }
    /* No Web Speech: fallback to Youdao with first few words */
    url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text.slice(0, 50)) + '&type=2';
  }
  ttsAudio = new Audio(url);
  if (btn) btn.classList.add('speaking');
  showSpeakingBar(text);
  ttsAudio.onended = function() {
    if (btn) btn.classList.remove('speaking');
    hideSpeakingBar();
    if (onDone) onDone();
  };
  ttsAudio.onerror = function() {
    if (btn) btn.classList.remove('speaking');
    hideSpeakingBar();
    /* Fallback to Web Speech if Youdao fails */
    if (webSpeechAvailable) {
      var utter2 = new SpeechSynthesisUtterance(text);
      utter2.lang = 'en-US'; utter2.rate = 0.88;
      var ev2 = getEnVoice(); if (ev2) utter2.voice = ev2;
      utter2.onend = function() { if (onDone) onDone(); };
      window.speechSynthesis.speak(utter2);
    } else {
      showToast('发音失败，请检查网络', true);
      if (onDone) onDone();
    }
  };
  ttsAudio.play().catch(function() {
    if (btn) btn.classList.remove('speaking');
    hideSpeakingBar();
    if (webSpeechAvailable) {
      var utter3 = new SpeechSynthesisUtterance(text);
      utter3.lang = 'en-US'; utter3.rate = 0.88;
      var ev3 = getEnVoice(); if (ev3) utter3.voice = ev3;
      utter3.onend = function() { if (onDone) onDone(); };
      window.speechSynthesis.speak(utter3);
    } else {
      showToast('发音失败，请检查网络', true);
      if (onDone) onDone();
    }
  });
}

function stopTTS() {
  if (ttsAudio) { ttsAudio.pause(); ttsAudio.onended = null; ttsAudio.onerror = null; ttsAudio = null; }
}

/* Speak a single word — Youdao Dict TTS primary, Web Speech fallback */
function speakWord(word, btn) {
  playGoogleTTS(word, btn);
}

/* Speak long text — try Web Speech first, fallback to Google TTS by sentence */
function speakText(text, label) {
  if (webSpeechAvailable) {
    speechStarted = false;
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US'; utter.rate = 0.88;
    var ev = getEnVoice(); if (ev) utter.voice = ev;
    currentUtterance = utter;
    utter.onstart = function() { speechStarted = true; };
    utter.onend = function() { hideSpeakingBar(); };
    utter.onerror = function() { hideSpeakingBar(); };
    window.speechSynthesis.speak(utter);
    showSpeakingBar(label || text.slice(0, 30) + '...');
    /* If Web Speech silently fails (common in Chrome file://), fall back to Google TTS */
    setTimeout(function() {
      if (!speechStarted) {
        window.speechSynthesis.cancel();
        speakViaGoogleTTS(text, label);
      }
    }, 1200);
    return;
  }
  speakViaGoogleTTS(text, label);
}

/* Split long text into sentences and play via Google TTS one by one */
var ttsQueue = [];
var ttsPlaying = false;
function speakViaGoogleTTS(text, label) {
  var sentences = text.match(/[^.!?\n]+[.!?\n]*/g) || [text];
  ttsQueue = sentences.map(function(s) { return s.trim(); }).filter(Boolean);
  ttsPlaying = true;
  showSpeakingBar(label || '朗读文章');
  playNextTTS();
}

function playNextTTS() {
  if (!ttsPlaying || ttsQueue.length === 0) { ttsPlaying = false; hideSpeakingBar(); return; }
  var s = ttsQueue.shift();
  stopTTS();
  /* Use Web Speech API for sentence-level playback (works without external network) */
  if (webSpeechAvailable) {
    var utter = new SpeechSynthesisUtterance(s);
    utter.lang = 'en-US'; utter.rate = 0.88;
    var ev = getEnVoice(); if (ev) utter.voice = ev;
    utter.onend = function() { playNextTTS(); };
    utter.onerror = function() { ttsPlaying = false; hideSpeakingBar(); showToast('朗读失败', true); };
    window.speechSynthesis.speak(utter);
    return;
  }
  /* Fallback: Youdao for short sentences */
  var url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(s.slice(0, 100)) + '&type=2';
  ttsAudio = new Audio(url);
  ttsAudio.onended = function() { playNextTTS(); };
  ttsAudio.onerror = function() { ttsPlaying = false; hideSpeakingBar(); showToast('朗读失败', true); };
  ttsAudio.play().catch(function() { ttsPlaying = false; hideSpeakingBar(); showToast('朗读失败', true); });
}

function stopSpeaking() {
  ttsPlaying = false;
  ttsQueue = [];
  stopTTS();
  if (webSpeechAvailable) window.speechSynthesis.cancel();
  hideSpeakingBar();
  document.querySelectorAll('.speak-btn.speaking').forEach(function(b) { b.classList.remove('speaking'); });
}

function showSpeakingBar(text) {
  document.getElementById('speakingText').textContent = '\uD83D\uDD0A ' + text;
  document.getElementById('speakingBar').classList.add('active');
}
function hideSpeakingBar() {
  document.getElementById('speakingBar').classList.remove('active');
}

/* ========== Translation ========== */
var TRANS_CACHE = {};
function translateText(text) {
  return new Promise(function(resolve) {
    if (!text || !text.trim()) { resolve(''); return; }
    var key = text.trim();
    if (TRANS_CACHE[key]) { resolve(TRANS_CACHE[key]); return; }
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(key) + '&langpair=en|zh-CN')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var result = '';
        if (data && data.responseData && data.responseData.translatedText) {
          result = data.responseData.translatedText;
        } else if (data && data.translatedText) {
          result = data.translatedText;
        }
        result = result.replace(/\[\[.*?\]\]/g, '').trim();
        TRANS_CACHE[key] = result;
        resolve(result);
      })
      .catch(function() { resolve(''); });
  });
}

/* ========== Data ========== */
function loadData() {
  var stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      var d = JSON.parse(stored);
      d.forEach(function(w) {
        if (!w.similarWords) w.similarWords = [];
        if (!w.collocations) w.collocations = [];
        if (!w.memoryAids) {
          w.memoryAids = [];
          // Migrate old per-def memory to word-level
          (w.definitions || []).forEach(function(def) {
            if (def.memoryEn && def.memoryEn.trim()) {
              w.memoryAids.push({ title: '助记', contentEn: def.memoryEn, contentCn: def.memoryCn || '' });
              def.memoryEn = ''; def.memoryCn = '';
            }
          });
        }
      });
      return d;
    } catch(e) { return initialData; }
  }
  return initialData;
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

/* ========== Utilities ========== */
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlightWord(sentence, w) {
  if (!sentence) return '';
  var regex = new RegExp('(' + escapeRegExp(w) + '\\w*)', 'gi');
  return sentence.replace(regex, '<em>$1</em>');
}
function hlSpan(w) {
  return '<span class="article-highlight">' + w + '</span>';
}

/* ========== Render Card ========== */
function renderCard(word, realIdx) {

    definitionsHtml += '<div class="def-top">';
    definitionsHtml += '<span class="pos-tag ' + pi.cls + '">' + pi.label + '</span>';
    definitionsHtml += '<span class="def-en">' + escapeHtml(def.meaning) + '</span>';
    definitionsHtml += '</div>';
    if (def.example) {
      definitionsHtml += '<div class="example-block" id="ex-block-' + realIdx + '-' + di + '">';
      definitionsHtml += '<button class="translate-btn" id="' + btnId + '" onclick="translateExample(' + realIdx + ',' + di + ',this)">翻译</button>';
      definitionsHtml += '<button class="analyze-btn" onclick="toggleSentenceAnalysis(\'' + 'sa-box-' + realIdx + '-' + di + '\')">🔍 解读</button>';
      definitionsHtml += '<div class="example-en">' + highlightWord(def.example, word.word) + '</div>';
      if (def.exampleCn) {
        definitionsHtml += '<div class="example-cn" id="' + cnId + '">' + escapeHtml(def.exampleCn) + '</div>';
      } else {
        definitionsHtml += '<div class="example-cn" id="' + cnId + '" style="display:none;"></div>';

      definitionsHtml += '<div class="translation-result" id="' + exId + '"></div>';
      definitionsHtml += '<div class="sentence-analysis-box" id="sa-box-' + realIdx + '-' + di + '"></div>';
      definitionsHtml += '</div>';
    }
    definitionsHtml += '</div>';
  });

  // Memory aids
  var memoryHtml = '';
  var memoryAids = word.memoryAids || [];
  if (memoryAids.length > 0) {

    memoryAids.forEach(function(ma, mai) {

      memoryHtml += '<div class="memory-content"><div class="memory-inner">';

      } else {
        memoryHtml += '<div class="memory-cn" id="ma-cn-' + realIdx + '-' + mai + '" style="display:none;"></div>';
      }
      memoryHtml += '<button class="memory-translate-btn" onclick="translateMemoryAid(' + realIdx + ',' + mai + ',this)">\uD83C\uDF10 翻译助记</button>';
      memoryHtml += '</div></div></div>';
    });
    memoryHtml += '</div>';

  var uniqueForms = [];
  (word.forms || []).forEach(function(f) { if (uniqueForms.indexOf(f) === -1) uniqueForms.push(f); });
  var similarWords = word.similarWords || [];

  if (word.phonetic) card += '<span class="word-phonetic">' + escapeHtml(word.phonetic) + '</span>';

function renderCards(filter) {
  filter = filter || '';
  var container = document.getElementById('cardsContainer');
  var filtered = filter
    ? wordsData.filter(function(w) {
        return w.word.toLowerCase().indexOf(filter.toLowerCase()) !== -1 ||
          w.definitions.some(function(d) { return d.meaning.toLowerCase().indexOf(filter.toLowerCase()) !== -1; });
      })
    : wordsData;

  if (filtered.length === 0) {
    container.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">\uD83D\uDCDC</div>' +
        '<p>' + (filter ? '没有找到匹配的单词' : '还没有添加单词，点击「新增单词」开始吧') + '</p>' +
        (!filter ? '<button class="btn btn-accent" onclick="openAddModal()">+ 新增单词</button>' : '') +
      '</div>';
  } else {
    var html = '';
    filtered.forEach(function(w) { html += renderCard(w, wordsData.indexOf(w)); });
    container.innerHTML = html;
  }
  updateStats();
}

function searchWord(word) {
  document.getElementById('searchInput').value = word;
  renderCards(word);
  setTimeout(function() {
    var card = document.querySelector('[data-idx]');

function updateStats() {
  document.getElementById('wordCount').textContent = wordsData.length;

/* ========== Sentence Analysis ========== */
function toggleSentenceAnalysis(boxId) {
  var box = document.getElementById(boxId);
  if (!box) return;
  if (box.classList.contains('visible')) {
    box.classList.remove('visible');
    return;
  }
  // Find the example text from the parent example-block
  var parent = box.parentElement;
  var enDiv = parent.querySelector('.example-en');
  if (!enDiv) return;
  var sentence = enDiv.innerText || enDiv.textContent;
  doSentenceAnalysis(sentence, box);
}

function doSentenceAnalysis(sentence, targetEl) {
  targetEl.classList.add('visible');
  targetEl.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-light);">正在分析...</div>';

  // Parse the sentence
  var resultHtml = '';

  // 1. Chinese translation
  resultHtml += '<div class="sa-section">';
  resultHtml += '<div class="sa-label">中文翻译</div>';
  resultHtml += '<div class="sa-translation" id="' + targetEl.id + '-tr">翻译中...</div>';
  resultHtml += '</div>';

  // 2. Sentence structure - split by clauses
  var clauses = splitIntoClauses(sentence);
  resultHtml += '<div class="sa-section">';
  resultHtml += '<div class="sa-label">句子结构拆分</div>';
  resultHtml += '<div class="sa-structure">';
  clauses.forEach(function(cl, i) {
    var type = i === 0 ? 'main' : (cl.type || 'sub');
    var label = type === 'main' ? '主句' : (type === 'relative' ? '定语从句' : (type === 'adverbial' ? '状语从句' : '从句'));
    resultHtml += '<div style="margin:6px 0;">';
    resultHtml += '<span class="sa-clause sa-clause-' + type + '">' + escapeHtml(cl.text) + '</span>';
    resultHtml += ' <span style="font-size:11px;color:var(--tag-adv);font-weight:700;">[' + label + ']</span>';
    resultHtml += '</div>';
  });
  resultHtml += '</div></div>';

  // 3. Key vocabulary from the sentence
  var keywords = extractKeywords(sentence);
  if (keywords.length > 0) {
    resultHtml += '<div class="sa-section">';
    resultHtml += '<div class="sa-label">关键词汇</div>';
    resultHtml += '<div class="sa-keywords">';
    keywords.forEach(function(kw) {
      resultHtml += '<span class="sa-kw">' + escapeHtml(kw) + '</span>';
    });
    resultHtml += '</div></div>';
  }

  // 4. Grammar points
  var grammarPoints = detectGrammar(sentence);
  if (grammarPoints.length > 0) {
    resultHtml += '<div class="sa-section">';
    resultHtml += '<div class="sa-label">语法要点</div>';
    resultHtml += '<div class="sa-grammar">';
    grammarPoints.forEach(function(gp) {
      resultHtml += '<div style="margin:4px 0;"><span class="sa-grammar-tag">' + escapeHtml(gp.type) + '</span>' + escapeHtml(gp.desc) + '</div>';
    });
    resultHtml += '</div></div>';
  }

  targetEl.innerHTML = resultHtml;

  // Now fetch translation
  translateText(sentence).then(function(tr) {
    var trDiv = document.getElementById(targetEl.id + '-tr');
    if (trDiv) trDiv.textContent = tr || '翻译失败，请重试';
  });
}

function splitIntoClauses(sentence) {
  var clauses = [];
  // Simple clause splitting heuristics
  var delimiters = [
    { pattern: /,\s*who\s/gi, type: 'relative' },
    { pattern: /,\s*which\s/gi, type: 'relative' },
    { pattern: /,\s*that\s/gi, type: 'relative' },
    { pattern: /,\s*whose\s/gi, type: 'relative' },
    { pattern: /,\s*whom\s/gi, type: 'relative' },
    { pattern: /\bwhen\b/gi, type: 'adverbial' },
    { pattern: /\bwhile\b/gi, type: 'adverbial' },
    { pattern: /\bbecause\b/gi, type: 'adverbial' },
    { pattern: /\balthough\b/gi, type: 'adverbial' },
    { pattern: /\bif\b/gi, type: 'adverbial' },
    { pattern: /\bsince\b/gi, type: 'adverbial' },
    { pattern: /\balthough\b/gi, type: 'adverbial' },
    { pattern: /\beven though\b/gi, type: 'adverbial' },
    { pattern: /\bso that\b/gi, type: 'adverbial' }
  ];

  // Try splitting by comma + conjunction
  var parts = sentence.split(/,\s*(?=\b(?:who|which|that|whose|whom|when|while|because|although|if|since|where|whereas|even though|so that)\b)/gi);
  if (parts.length <= 1) {
    // Try splitting by semicolons or periods
    parts = sentence.split(/[;.]\s*/);
  }

  if (parts.length <= 1) {
    clauses.push({ text: sentence.trim(), type: 'main' });
  } else {
    parts.forEach(function(p, i) {
      var trimmed = p.trim();
      if (!trimmed) return;
      var type = 'sub';
      if (i === 0) {
        type = 'main';
      } else {
        // Detect clause type
        var lower = trimmed.toLowerCase();
        if (/^(who|which|that|whose|whom)\b/.test(lower)) type = 'relative';
        else if (/^(when|while|because|although|if|since|where|whereas)\b/.test(lower)) type = 'adverbial';
      }
      clauses.push({ text: trimmed, type: type });
    });
  }
  return clauses;
}

function extractKeywords(sentence) {
  // Simple: extract longer words (>5 chars) that aren't common
  var stopWords = ['which','their','there','these','those','about','would','could','should','might','every','other','where','after','before','between','through','during','without','however','another','because','although','nothing','something','anything','everything'];
  var words = sentence.match(/[a-zA-Z']+/g) || [];
  var keywords = [];
  words.forEach(function(w) {
    var lower = w.toLowerCase();
    if (lower.length > 5 && keywords.indexOf(lower) === -1 && stopWords.indexOf(lower) === -1) {
      keywords.push(lower);
    }
  });
  return keywords.slice(0, 8);
}

function detectGrammar(sentence) {
  var points = [];
  var lower = sentence.toLowerCase();

  // Passive voice
  if (/\b(is|are|was|were|been|being)\s+\w+ed\b/.test(lower) || /\b(is|are|was|were|been|being)\s+\w+en\b/.test(lower)) {
    points.push({ type: '被动语态', desc: '句子中包含被动语态结构 (be + 过去分词)' });
  }
  // Relative clause
  if (/\b(who|which|that|whose|whom)\b/.test(lower)) {
    points.push({ type: '定语从句', desc: '句子中包含由 who/which/that/whose 引导的定语从句' });
  }
  // Conditional
  if (/\bif\b/.test(lower)) {
    points.push({ type: '条件句', desc: '句子中包含 if 条件从句' });
  }
  // Subjunctive hint
  if (/\b(would|could|should|might)\b/.test(lower)) {
    points.push({ type: '虚拟语气', desc: '句子中包含虚拟语气/情态动词' });
  }
  // Adverbial clause
  if (/\b(when|while|because|although|since|even though|so that|whereas)\b/.test(lower)) {
    points.push({ type: '状语从句', desc: '句子中包含状语从句' });
  }
  // Gerund / infinitive
  if (/\bto\s+\w+\b/.test(lower)) {
    points.push({ type: '不定式', desc: '句子中包含动词不定式结构' });
  }
  if (/\b\w+ing\b/.test(lower)) {
    points.push({ type: '动名词/现在分词', desc: '句子中包含 -ing 形式' });
  }
  // Comparative / superlative
  if (/\bmore\s+\w+|\b\w+er\s+than\b|\bmost\s+\w+|\b\w+est\b/.test(lower)) {
    points.push({ type: '比较级/最高级', desc: '句子中包含比较级或最高级结构' });
  }

  return points;
}

/* ========== Auto-Generate Collocations ========== */
function autoGenerateCollocations() {
  var word = document.getElementById('inputWord').value.trim();
  if (!word) { showToast('请先输入单词', true); return; }

  showToast('正在从词典获取搭配...');

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word))
    .then(function(r) {
      if (!r.ok) throw new Error('not found');
      return r.json();
    })
    .then(function(data) {
      var newCollos = [];

      if (Array.isArray(data)) {
        data.forEach(function(entry) {
          if (!entry.meanings) return;
          entry.meanings.forEach(function(m) {
            var posLabel = m.partOfSpeech || '';
            (m.definitions || []).forEach(function(def) {
              /* Extract collocation from example sentence */
              if (def.example) {
                var phrase = extractColloFromExample(def.example, word);
                if (phrase && phrase.split(/\s+/).length >= 2 && phrase.split(/\s+/).length <= 6) {
                  var exists = newCollos.some(function(nc) { return nc.phrase.toLowerCase() === phrase.toLowerCase(); });
                  if (!exists) {
                    newCollos.push({ phrase: phrase, meaning: '', example: def.example });
                  }
                }
              }
            });
            /* Also check synonyms and their usage */
            (m.synonyms || []).forEach(function(syn) {
              if (syn.split(/\s+/).length > 1) {
                var exists = newCollos.some(function(nc) { return nc.phrase.toLowerCase() === syn.toLowerCase(); });
                if (!exists) newCollos.push({ phrase: syn, meaning: '', example: '' });
              }
            });
          });
        });
      }

      /* Add template-based collocations from word's POS */
      var posVal = currentDefs.length > 0 ? currentDefs[0].pos : 'v';
      var templates = generateTemplateCollocations(word, posVal);
      templates.forEach(function(tc) {
        var exists = newCollos.some(function(nc) { return nc.phrase.toLowerCase() === tc.phrase.toLowerCase(); });
        if (!exists) newCollos.push(tc);
      });

      if (newCollos.length === 0) {
        showToast('未找到搭配数据，请手动添加', true);
        return;
      }

      /* Translate meanings */
      var proms = [];
      newCollos.forEach(function(nc) {
        if (!nc.meaning) {
          proms.push(translateText(nc.phrase).then(function(tr) { nc.meaning = tr || ''; }));
        }
      });

      Promise.all(proms).then(function() {
        /* Deduplicate and filter */
        var seen = {};
        var unique = [];
        newCollos.forEach(function(nc) {
          var key = nc.phrase.toLowerCase().trim();
          if (!seen[key] && key.split(/\s+/).length >= 2) {
            seen[key] = true;
            unique.push(nc);
          }
        });

        /* Limit to 8 collocations */
        unique = unique.slice(0, 8);
        currentCollos = currentCollos.concat(unique);
        renderColloEntries(currentCollos);
        showToast('已生成 ' + unique.length + ' 个搭配 ✓');
      });
    })
    .catch(function() {
      /* Offline fallback: use templates only */
      var posVal = currentDefs.length > 0 ? currentDefs[0].pos : 'v';
      var templates = generateTemplateCollocations(word, posVal);
      if (templates.length === 0) {
        showToast('获取搭配失败，请手动添加', true);
        return;
      }
      var proms = [];
      templates.forEach(function(tc) {
        proms.push(translateText(tc.phrase).then(function(tr) { tc.meaning = tr || ''; }));
      });
      Promise.all(proms).then(function() {
        currentCollos = currentCollos.concat(templates);
        renderColloEntries(currentCollos);
        showToast('已生成 ' + templates.length + ' 个搭配（模板）');
      });
    });
}

function extractColloFromExample(sentence, word) {
  /* Extract phrase: target word ± 1-2 content words */
  var words = sentence.split(/\s+/);
  var idx = -1;
  for (var i = 0; i < words.length; i++) {
    if (words[i].toLowerCase().replace(/[^a-z]/g, '') === word.toLowerCase()) { idx = i; break; }
  }
  if (idx === -1) return null;

  var start = Math.max(0, idx - 1);
  var end = Math.min(words.length, idx + 3);
  var phrase = words.slice(start, end).join(' ');
  /* Clean punctuation */
  phrase = phrase.replace(/^[,;:\s]+|[,;:\s]+$/g, '').replace(/\s+/g, ' ');
  /* Remove leading articles/prepositions if they make the phrase awkward */
  phrase = phrase.replace(/^(the|a|an|to|in|on|at|of|for|with|by|and|or|but)\s+/i, '');
  return phrase;
}

function generateTemplateCollocations(word, pos) {
  var templates = [];
  var w = word.toLowerCase();
  if (pos === 'v') {
    templates.push({ phrase: w + ' from', meaning: '' });
    templates.push({ phrase: w + ' throughout', meaning: '' });
    templates.push({ phrase: 'tend to ' + w, meaning: '' });
    templates.push({ phrase: w + ' into', meaning: '' });
  } else if (pos === 'adj') {
    templates.push({ phrase: 'highly ' + w, meaning: '' });
    templates.push({ phrase: 'completely ' + w, meaning: '' });
    templates.push({ phrase: w + ' enough', meaning: '' });
  } else if (pos === 'n') {
    templates.push({ phrase: 'a sense of ' + w, meaning: '' });
    templates.push({ phrase: 'lack of ' + w, meaning: '' });
    templates.push({ phrase: w + ' of', meaning: '' });
  } else if (pos === 'adv') {
    templates.push({ phrase: w + ' enough', meaning: '' });
  }
  return templates;
}

function saveWord() {
  var word = document.getElementById('inputWord').value.trim();
  if (!word) { showToast('请输入单词', true); return; }
  var validDefs = currentDefs.filter(function(d) { return d.meaning.trim(); });
  if (validDefs.length === 0) { showToast('请至少添加一条释义', true); return; }
  var phonetic = document.getElementById('inputPhonetic').value.trim();
  var formsStr = document.getElementById('inputForms').value.trim();
  var forms = formsStr ? formsStr.split(/[,，]/).map(function(s) { return s.trim(); }).filter(Boolean) : [];
  var similarStr = document.getElementById('inputSimilar').value.trim();
  var similarWords = similarStr ? similarStr.split(/[,，]/).map(function(s) { return s.trim(); }).filter(Boolean) : [];
  var validCollos = currentCollos.filter(function(c) { return c.phrase.trim() && c.meaning.trim(); });
  var validMAs = currentMAs.filter(function(ma) { return ma.contentEn.trim(); });

  var entry = { word: word, phonetic: phonetic, forms: forms, similarWords: similarWords, collocations: validCollos, memoryAids: validMAs, definitions: validDefs };
  if (editingIdx !== null) {
    wordsData[editingIdx] = entry;
    showToast('单词已更新 \u2713');
  } else {
    wordsData.push(entry);
    showToast('单词已添加 \u2713');
  }
  saveData(wordsData);
  renderCards(document.getElementById('searchInput').value);
  closeModal();
}

function importData() { document.getElementById('importFile').click(); }
function handleImport(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var imported = JSON.parse(ev.target.result);
      if (Array.isArray(imported)) {
        imported.forEach(function(w) {
          if (!w.similarWords) w.similarWords = [];
          if (!w.collocations) w.collocations = [];
          if (!w.memoryAids) {
            w.memoryAids = [];
            (w.definitions || []).forEach(function(def) {
              if (def.memoryEn && def.memoryEn.trim()) {
                w.memoryAids.push({ title: '助记', contentEn: def.memoryEn, contentCn: def.memoryCn || '' });
                def.memoryEn = ''; def.memoryCn = '';
              }
            });
          }
        });
        wordsData = imported;
        saveData(wordsData);
        renderCards();
        showToast('导入成功，共 ' + imported.length + ' 个单词');
      } else {
        showToast('文件格式不正确', true);
      }
    } catch(err) { showToast('解析文件失败', true); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function doGenerateArticle() {
  var checkboxes = document.querySelectorAll('#wordSelectGrid input[type="checkbox"]:checked');
  var selectedIndices = [];
  checkboxes.forEach(function(cb) { selectedIndices.push(parseInt(cb.value)); });
  if (selectedIndices.length < 2) { showToast('请至少选择2个单词', true); return; }

  var theme = document.getElementById('articleTheme').value;
  var words = selectedIndices.map(function(i) { return wordsData[i]; });
  var articleHtml = '';

  if (theme === 'conversation') {
    articleHtml = generateConversationArticle(words);
  } else {
    articleHtml = generateStandardArticle(words, theme);
  }

  document.getElementById('articleContent').innerHTML = articleHtml;
  var t = ARTICLE_THEMES[theme];
  document.getElementById('articleTitleText').textContent = t ? t.title : 'Over Coffee';

  // Build vocabulary list
  var vocabHtml = '<h4>\uD83D\uDCCB 重点词汇</h4>';
  words.forEach(function(w) {
    var def = w.definitions[0];
    var pos = (POS_MAP[def.pos] || {label: def.pos}).label;
    vocabHtml += '<div class="vocab-item">';
    vocabHtml += '<span class="vocab-word">' + escapeHtml(w.word) + '</span>';
    vocabHtml += '<span class="vocab-pos">(' + pos + ')</span>';
    vocabHtml += '<span class="vocab-meaning">' + escapeHtml(def.meaning) + '</span>';
    vocabHtml += '</div>';
  });
  document.getElementById('articleVocab').innerHTML = vocabHtml;

  // Reset translation
  document.getElementById('articleTranslation').classList.remove('visible');
  document.getElementById('articleOutput').classList.add('visible');
  showToast('文章已生成 \u2713');
}

function generateStandardArticle(words, theme) {
  var t = ARTICLE_THEMES[theme] || ARTICLE_THEMES.narrative;
  var html = '<p>' + t.intro;
  words.forEach(function(w, idx) {
    var def = w.definitions[0];
    var pos = (POS_MAP[def.pos] || {label: def.pos}).label;

    if (idx > 0) {
      html += t.connectors[(idx - 1) % t.connectors.length];
    }

    if (theme === 'narrative') {
      if (def.example) {
        html += highlightArticleWords(def.example, words) + ' ';
      } else {
        html += 'the ' + pos + ' ' + hlSpan(w.word) + ' \u2014 to ' + escapeHtml(def.meaning) + ' \u2014 became vividly clear. ';
      }
    } else if (theme === 'science') {
      if (def.example) {
        html += 'the ' + pos + ' ' + hlSpan(w.word) + ' (' + escapeHtml(def.meaning) + ') plays a significant role. ' + highlightArticleWords(def.example, words) + ' ';
      } else {
        html += hlSpan(w.word) + ' (' + pos + ') refers to ' + escapeHtml(def.meaning) + '. ';
      }
    } else if (theme === 'essay') {
      html += 'The ' + pos + ' ' + hlSpan(w.word) + ' means "' + escapeHtml(def.meaning) + '." ';
      if (def.example) {
        html += 'For example: ' + highlightArticleWords(def.example, words) + ' ';
      }
    }
  });
  html += t.outro + '</p>';
  return html;
}

function generateConversationArticle(words) {
  var names = ['Alex', 'Sam'];
  var html = '<p>"Have you ever thought about how language shapes our understanding?" ' + names[0] + ' asked over coffee.</p>';
  words.forEach(function(w, idx) {
    var def = w.definitions[0];
    var pos = (POS_MAP[def.pos] || {label: def.pos}).label;
    var speaker = names[idx % 2];
    var listener = names[(idx + 1) % 2];
    var reactions = ['That\'s interesting!', 'I never thought of it that way.', 'Really?', 'That makes sense.', 'Fascinating!', 'Tell me more.'];
    var reaction = reactions[idx % reactions.length];
    html += '<p>"You know, the ' + pos + ' ' + hlSpan(w.word) + ' \u2014 it means "' + escapeHtml(def.meaning) + '."';
    if (def.example) { html += ' Like this: ' + highlightArticleWords(def.example, words); }
    html += '" ' + speaker + ' said.</p>';
    html += '<p>"' + reaction + '" ' + listener + ' nodded.';
    if (idx < words.length - 1) {
      var nextW = words[idx + 1];
      var nextPos = (POS_MAP[nextW.definitions[0].pos] || {label: nextW.definitions[0].pos}).label;
      html += ' And speaking of interesting words, have you heard of ' + hlSpan(nextW.word) + '? It\'s a ' + nextPos + ' that means "' + escapeHtml(nextW.definitions[0].meaning) + '."';
    }
    html += '</p>';
  });
  html += '<p>"Language really is fascinating, isn\'t it?" ' + names[0] + ' smiled, taking another sip of coffee.</p>';
  return html;
}

function highlightArticleWords(sentence, allWords) {
  if (!sentence) return '';
  var result = escapeHtml(sentence);
  allWords.forEach(function(w) {
    var regex = new RegExp('(' + escapeRegExp(escapeHtml(w.word)) + '\\w*)', 'gi');
    result = result.replace(regex, '<span class="article-highlight">$1</span>');
  });
  return result;
}

function translateArticle() {
  var content = document.getElementById('articleContent');
  var text = content.innerText || content.textContent;
  if (!text.trim()) { showToast('请先生成文章', true); return; }

  var trDiv = document.getElementById('articleTranslation');
  var trContent = document.getElementById('articleTranslationContent');
  if (trDiv.classList.contains('visible')) {
    trDiv.classList.remove('visible');
    return;
  }

  trContent.innerHTML = '<div style="color:var(--text-light);">正在翻译文章...</div>';
  trDiv.classList.add('visible');

  // Split into paragraphs and translate each
  var paragraphs = text.split(/\n+/).filter(function(p) { return p.trim(); });
  var proms = paragraphs.map(function(p) { return translateText(p); });

  Promise.all(proms).then(function(results) {
    var html = '';
    results.forEach(function(r, i) {
      if (r) html += '<p style="margin:8px 0;line-height:1.8;">' + escapeHtml(r) + '</p>';
    });
    if (!html) html = '<p>翻译失败，请重试</p>';
    trContent.innerHTML = html;
    showToast('文章翻译完成 \u2713');
  });
}

/* ========== Sentence Analyzer Modal ========== */
function openAnalyzerModal() {
  document.getElementById('analyzerInput').value = '';
  document.getElementById('analyzerResult').classList.remove('visible');
  document.getElementById('analyzerModal').classList.add('show');
}
function closeAnalyzerModal() {
  document.getElementById('analyzerModal').classList.remove('show');
}

function analyzeSentence() {
  var input = document.getElementById('analyzerInput').value.trim();
  if (!input) { showToast('请输入句子', true); return; }

  var resultDiv = document.getElementById('analyzerResult');
  resultDiv.classList.add('visible');

  doSentenceAnalysis(input, resultDiv);
}

/* ========== Toast ========== */
function showToast(msg, isError) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast' + (isError ? ' toast-error' : '');
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

/* ========== Search ========== */
document.getElementById('searchInput').addEventListener('input', function(e) {
  renderCards(e.target.value);
});

/* ========== Init ========== */
renderCards();
</script>
